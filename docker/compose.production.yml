name: sivmi-crm-production

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: 3306
  REDIS_HOST: redis
  REDIS_PORT: 6379
  INSTALL_DEPENDENCIES_ON_START: "false"
  OPTIMIZE_ON_START: "true"
  WAIT_FOR_DATABASE: "true"

x-app: &app
  image: sivmi-crm-php:${IMAGE_TAG:-latest}
  build:
    context: ..
    dockerfile: docker/php/Dockerfile
    target: production
  env_file:
    - path: ${APP_ENV_FILE:-.env.production}
      required: true
  environment:
    <<: *app-environment
  volumes:
    - storage_data:/var/www/html/storage
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    image: sivmi-crm-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  queue:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      OPTIMIZE_ON_START: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      OPTIMIZE_ON_START: "false"
    command: php artisan schedule:work
    healthcheck:
      disable: true

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE wajib diisi}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi}
    restart: unless-stopped

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha}
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY_HASH:?WAHA_API_KEY_HASH wajib diisi}
      WHATSAPP_API_KEY_EXCLUDE_PATH: health,ping
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WAHA_NAMESPACE: all
      WAHA_WORKER_RESTART_SESSIONS: "true"
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  storage_data:
  waha_sessions:
