name: sivmi-crm

x-app-environment: &app-environment
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: 3306
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-app: &app
  image: sivmi-crm-php:local
  build:
    context: ..
    dockerfile: docker/php/Dockerfile
    target: development
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    <<: *app-environment
  volumes:
    - ../:/var/www/html
    - composer_vendor:/var/www/html/vendor
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    container_name: sivmi-crm-app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    container_name: sivmi-crm-web
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ../:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mysql:8.4
    container_name: sivmi-crm-database
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sivmi_crm}
      MYSQL_USER: ${DB_USERNAME:-sivmi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sivmi_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: sivmi-crm-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  node:
    image: node:22-alpine
    container_name: sivmi-crm-node
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_DEV_SERVER_URL: "http://localhost:${VITE_PORT:-5173}"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ../:/var/www/html
      - node_modules:/var/www/html/node_modules
    restart: unless-stopped

  queue:
    <<: *app
    container_name: sivmi-crm-queue
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    profiles: ["workers"]

  scheduler:
    <<: *app
    container_name: sivmi-crm-scheduler
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    command: php artisan schedule:work
    profiles: ["workers"]

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows}
    container_name: sivmi-crm-waha
    ports:
      - "${WAHA_PORT:-3000}:3000"
    extra_hosts:
      - "sivmi.crm.test:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-sivmi-waha-local-change-me}
      WHATSAPP_API_KEY_EXCLUDE_PATH: health,ping
      WAHA_DASHBOARD_ENABLED: ${WAHA_DASHBOARD_ENABLED:-true}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-sivmi-waha-dashboard-local-change-me}
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-GOWS}
      GODEBUG: ${WAHA_GODEBUG:-netdns=go}
      WAHA_PRINT_QR: "false"
      WAHA_NAMESPACE: all
      WAHA_WORKER_RESTART_SESSIONS: "true"
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  composer_vendor:
  mysql_data:
  node_modules:
  redis_data:
  waha_sessions:
